<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego: Sin Pasarse</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: white; text-align: center; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; max-width: 450px; margin: auto; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3); }
    input { width: 80%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #334155; font-size: 16px; background: #0f172a; color: white; text-align: center; }
    button { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; width: 85%; }
    button:hover { background: #1d4ed8; }
    .btn-danger { background: #dc2626; }
    .winner { font-size: 24px; color: #4ade80; margin-top: 20px; font-weight: bold; background: #064e3b; padding: 15px; border-radius: 8px; }
    ul { list-style: none; padding: 0; }
    li { background: #334155; margin: 5px 0; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <div id="vista-jugador" class="card">
    <h2>🎯 ¡A Jugar!</h2>
    <p>Ingresá tu respuesta sin pasarte</p>
    <input type="text" id="nombre" placeholder="Tu Nombre / Apodo">
    <input type="number" id="numero" placeholder="Tu Número">
    <button onclick="enviarRespuesta()">Enviar Respuesta</button>
    <p id="msj-jugador" style="color: #60a5fa;"></p>
  </div>

  <div id="vista-host" class="card" style="display:none; max-width: 600px;">
    👑 <h2>Panel del Presentador</h2>
    <input type="number" id="valor-real" placeholder="Ingresá el VALOR REAL aquí">
    <br>
    <button onclick="calcularGanador()">🔥 Revelar Ganador</button>
    <button onclick="reiniciarRonda()" class="btn-danger">🔄 Nueva Ronda</button>

    <div id="resultado"></div>

    <h3>Respuestas Recibidas (<span id="count">0</span>)</h3>
    <ul id="lista-respuestas"></ul>
  </div>

  <script>
    // --- CONFIGURACIÓN SUPABASE ---
    const SUPABASE_URL = "https://nwbgghnnviawepfnqktv.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53YmdnaG5udmlhd2VwZm5xa3R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0MTI4NzMsImV4cCI6MjEwMDk4ODg3M30.tk5dbetd7qxZ0xh1vZLQe71nKdGFeAO65iBZ7xUirCE";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Detectar si es Host por URL (ej: tu-app.vercel.app/?host=true)
    const urlParams = new URLSearchParams(window.location.search);
    const esHost = urlParams.get('host') === 'true';

    if (esHost) {
      document.getElementById('vista-jugador').style.display = 'none';
      document.getElementById('vista-host').style.display = 'block';
      cargarRespuestas();
      escucharRealtime();
    }

    let respuestaslocales = [];

    // --- LÓGICA JUGADOR ---
    async function enviarRespuesta() {
      const jugador = document.getElementById('nombre').value.trim();
      const numero = parseFloat(document.getElementById('numero').value);

      if (!jugador || isNaN(numero)) return alert('Por favor completá ambos campos');

      const { error } = await supabaseClient.from('respuestas').insert([{ jugador, numero }]);
      
      if (error) {
        alert('Error al enviar');
      } else {
        document.getElementById('msj-jugador').innerText = '✅ ¡Respuesta enviada! Esperá los resultados.';
      }
    }

    // --- LÓGICA HOST ---
    async function cargarRespuestas() {
      const { data } = await supabaseClient.from('respuestas').select('*');
      respuestaslocales = data || [];
      renderizarLista();
    }

    function escucharRealtime() {
      supabaseClient.channel('respuestas')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'respuestas' }, payload => {
          respuestaslocales.push(payload.new);
          renderizarLista();
        })
        .subscribe();
    }

    function renderizarLista() {
      const lista = document.getElementById('lista-respuestas');
      document.getElementById('count').innerText = respuestaslocales.length;
      lista.innerHTML = respuestaslocales.map(r => `<li><span>${r.jugador}</span> <strong>${r.numero}</strong></li>`).join('');
    }

    // --- MOTOR DEL JUEGO (EL MÁS CERCANO SIN PASARSE) ---
    function calcularGanador() {
      const valorReal = parseFloat(document.getElementById('valor-real').value);
      if (isNaN(valorReal)) return alert('Ingresá el valor real primero');

      // 1. Filtrar los que NO se pasaron
      const validos = respuestaslocales.filter(r => r.numero <= valorReal);

      const divRes = document.getElementById('resultado');

      if (validos.length === 0) {
        divRes.innerHTML = `<div class="winner" style="background:#7f1d1d; color:#fca5a5;">💥 ¡TODOS SE PASARON! Nadie suma puntos.</div>`;
        return;
      }

      // 2. Ordenar de mayor a menor (el número más alto que no se pasó es el ganador)
      validos.sort((a, b) => b.numero - a.numero);
      const ganador = validos[0];

      divRes.innerHTML = `
        <div class="winner">
          🏆 ¡GANADOR: ${ganador.jugador}! <br>
          Dijo ${ganador.numero} (Valor real: ${valorReal})
        </div>
      `;
    }

    async function reiniciarRonda() {
      if (!confirm('¿Limpiar todas las respuestas para la siguiente pregunta?')) return;
      await supabaseClient.from('respuestas').delete().neq('id', 0);
      respuestaslocales = [];
      document.getElementById('valor-real').value = '';
      document.getElementById('resultado').innerHTML = '';
      renderizarLista();
    }
  </script>
</body>
</html>
